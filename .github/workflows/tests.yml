name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PDF libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install Python dependencies
        run: ./setup.sh
      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Generate sample PDF
        run: ./run.sh examples/sample_chat.txt --output /tmp/sample-report.pdf
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('setup.ps1', 'run.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      # The runner image ships MSYS2 at C:\msys64, the default path used by the launchers.
      - name: Install Pango with MSYS2
        shell: pwsh
        run: C:\msys64\usr\bin\bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pango'
      # Windows PowerShell 5.1 is what most users run the launchers with.
      - name: Install Python dependencies
        shell: powershell
        run: .\setup.ps1
      - name: Run tests
        shell: powershell
        run: |
          $env:WEASYPRINT_DLL_DIRECTORIES = 'C:\msys64\ucrt64\bin'
          .venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate sample PDF
        shell: powershell
        run: |
          .\run.ps1 examples/sample_chat.txt --output "$env:RUNNER_TEMP\sample-report.pdf"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\sample-report.pdf")) { throw 'Sample PDF was not created.' }
